spring.application.name=ExploreWay
# Carga el .env con el soporte nativo de Spring Boot (sin librerías externas)
spring.config.import=optional:file:.env[.properties]
# Acceso a la base de datos
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT (JwtPropiedades lee jwt.secreto y jwt.expiracion-minutos)
jwt.secreto=${JWT_SECRETO}
jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Administrador inicial (AdminSeeder crea la cuenta solo si no existe)
admin.correo=${ADMIN_CORREO:}
admin.contra=${ADMIN_CONTRA:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Estrategia de nombrado para mantener nombres exactos definidos en @Table y @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect